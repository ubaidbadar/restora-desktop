name: Windows installer (unsigned test artifact)
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without Electron's install-time download
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Run security and packaging checks
        run: npm run check
      - name: Cache official Electron archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/restora-electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('electron-release.json') }}
      - name: Fetch and SHA-256 verify the official Electron Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath 'electron-release.json' -Raw | ConvertFrom-Json
          if ($manifest.platform -ne 'win32' -or $manifest.arch -ne 'x64') {
            throw 'Unexpected Electron archive platform/architecture'
          }
          $asset = "electron-v$($manifest.version)-win32-x64.zip"
          $directory = Join-Path $env:RUNNER_TEMP 'restora-electron'
          $archive = Join-Path $directory $asset
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $verified = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            if (Test-Path -LiteralPath $archive) {
              $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -eq $manifest.sha256) {
                $verified = $true
                break
              }
              Remove-Item -LiteralPath $archive -Force
              Write-Warning 'Cached Electron archive had a mismatched checksum; discarded'
            }
            Write-Host "Fetching $asset from electron/electron GitHub Releases (attempt $attempt/5)"
            gh release download "v$($manifest.version)" --repo electron/electron --pattern $asset --dir $directory --clobber
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $archive)) {
              $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $manifest.sha256) {
                Remove-Item -LiteralPath $archive -Force
                throw "Official Electron archive checksum mismatch (actual: $actual)"
              }
              $verified = $true
              break
            }
            if ($attempt -lt 5) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if ($verified) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "RESTORA_ELECTRON_ARCHIVE=$archive"
            Write-Host "Verified official Electron $($manifest.version) SHA-256: $($manifest.sha256)"
          } else {
            Write-Warning 'GitHub CLI download unavailable; packaging will retry through official @electron/get endpoint'
          }
      - name: Compile source-pinned native printing engine
        uses: ./.github/actions/build-print-engine

      - name: Package portable Windows desktop
        run: npm run dist:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate portable ZIP contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist -Filter 'Restora-POS-Portable-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Portable Windows ZIP is missing' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'restora-portable-validation'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpacked -Force
          foreach ($item in @('Restora POS.exe', 'resources/app/package.json', 'resources/app/src/main.cjs', 'resources/app/src/security.cjs', 'resources/app/src/print_engine.cjs', 'resources/print-engine/restora-pc-agent.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $unpacked $item))) {
              throw "Portable ZIP missing $item"
            }
          }
          Write-Host 'Portable ZIP file structure verified; interactive Windows acceptance remains required'
      - name: Smoke test packaged Electron owns native printing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desktop = Resolve-Path 'dist/portable/Restora POS.exe'
          $before = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).'Restora Agent'
          $process = Start-Process -FilePath $desktop -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw 'Packaged Restora Desktop quit during native startup' }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:17777/status' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'Restora Desktop did not start its included print engine' }
            $blocked = Invoke-WebRequest 'http://127.0.0.1:17777/print' -Method POST -Body '{}' -ContentType 'application/json' -SkipHttpErrorCheck
            if ($blocked.StatusCode -ne 403) { throw "Originless print not rejected: $($blocked.StatusCode)" }
            $after = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).'Restora Agent'
            if ($before -ne $after) { throw 'Embedded engine altered standalone Windows startup settings' }
            Write-Host 'Desktop launched native engine, kept origin security and did not install a separate startup service'
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          # The embedded engine watches its owner handle; no hidden service may remain.
          $stopped = $false
          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            Start-Sleep -Seconds 1
            try {
              $null = Invoke-WebRequest 'http://127.0.0.1:17777/status' -TimeoutSec 1
            } catch {
              $stopped = $true
              break
            }
          }
          if (-not $stopped) { throw 'Embedded printing engine survived the owning desktop process' }
          Write-Host 'Embedded engine stopped with Electron'

      - name: Test sandboxed Electron renderer can reach built-in printing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node).Source
          $web = Start-Process -FilePath $node -ArgumentList 'scripts/renderer-print-smoke.cjs' -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          $desktop = $null
          try {
            $env:RESTORA_DESKTOP_DEV = '1'
            $env:RESTORA_APP_URL = 'http://127.0.0.1:3000/'
            $env:RESTORA_ORIGINS = 'http://127.0.0.1:3000'
            $desktop = Start-Process -FilePath (Resolve-Path 'dist/portable/Restora POS.exe') -PassThru
            $reportFile = Join-Path $env:GITHUB_WORKSPACE 'renderer-print-smoke-result.json'
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              Start-Sleep -Seconds 1
              if (Test-Path $reportFile) { break }
              $desktop.Refresh()
              if ($desktop.HasExited) { throw 'Electron exited before renderer printing check' }
            }
            if (-not (Test-Path $reportFile)) { throw 'Electron renderer never reported its localhost fetch result' }
            $result = Get-Content -LiteralPath $reportFile -Raw | ConvertFrom-Json
            if ($result.ok -ne $true -or $result.status -ne 200 -or $result.ua -notlike '*RestoraDesktop/1*') {
              throw "Electron renderer could not reach secured native printing: $(ConvertTo-Json $result -Compress)"
            }
            Write-Host 'Sandboxed Electron renderer reached bundled printing service with trusted origin and desktop UI marker'
          } finally {
            if ($desktop) { Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue
            Remove-Item Env:RESTORA_DESKTOP_DEV -ErrorAction SilentlyContinue
            Remove-Item Env:RESTORA_APP_URL -ErrorAction SilentlyContinue
            Remove-Item Env:RESTORA_ORIGINS -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: restora-windows-portable
          path: dist/Restora-POS-Portable-*.zip
          if-no-files-found: error
      - name: Attempt NSIS unsigned test installer
        continue-on-error: true
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: restora-windows-unsigned-installer
          path: dist/Restora-POS-Setup-*.exe
          if-no-files-found: warn
