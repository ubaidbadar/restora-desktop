name: Windows installer (unsigned test artifact)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (skip the Electron runtime until packaging)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 4) { exit $LASTEXITCODE }
            Write-Host "Electron download failed; retrying attempt $($attempt + 1) ..."
            Start-Sleep -Seconds (15 * $attempt)
          }
      - run: npm run check
      - name: Package Electron runtime for Windows
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: restora-windows-unsigned-installer
          path: dist/*.exe
          if-no-files-found: error
