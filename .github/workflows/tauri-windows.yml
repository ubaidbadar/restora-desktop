name: Tauri 2 Windows desktop
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/tauri2-integrated-printing-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify no Electron runtime or dependencies
        shell: pwsh
        run: |
          if ((Get-Content package.json -Raw) -match 'electron') { throw 'Electron dependency found' }
          if (Test-Path 'src/main.cjs') { throw 'Old Electron entrypoint still exists' }
      - name: Check native source formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Resolve locked native dependencies
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Run native unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Check Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Verify desktop metadata
        run: npm run check
      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund
      - name: Build Windows NSIS setup
        run: npm run build
      - name: Assert Windows installer exists
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*setup.exe')
          if ($installer.Count -lt 1) { throw 'Tauri NSIS setup was not produced' }
          $installer | Select-Object Name, Length
      - name: Smoke launch and verify in-process printing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path (Get-Location) 'src-tauri/target/release/restora-desktop.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw "Tauri desktop binary missing: $binary" }
          $beforeAgents = @(Get-Process -Name 'restora-pc-agent' -ErrorAction SilentlyContinue).Count
          $process = Start-Process -FilePath $binary -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Restora Desktop exited unexpectedly (code $($process.ExitCode))" }
              try {
                $snapshot = Invoke-RestMethod -Uri 'http://127.0.0.1:17777/status' -TimeoutSec 2
                if ($null -ne $snapshot.paired) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'The built-in Rust print engine did not start' }
            $blocked = Invoke-WebRequest -Uri 'http://127.0.0.1:17777/setup/pair' -Method Post -ContentType 'application/json' -Body '{"code":"000000"}' -SkipHttpErrorCheck -TimeoutSec 3
            if ($blocked.StatusCode -ne 403) { throw "Originless pairing request was not blocked: $($blocked.StatusCode)" }
            $afterAgents = @(Get-Process -Name 'restora-pc-agent' -ErrorAction SilentlyContinue).Count
            if ($afterAgents -ne $beforeAgents) { throw 'A standalone print-agent process was unexpectedly created' }
            Write-Host 'Tauri app launched, in-process printer responded, unauthorized POST blocked; no child agent process.'
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Milliseconds 600
          try {
            $stillOpen = Invoke-WebRequest -Uri 'http://127.0.0.1:17777/status' -TimeoutSec 2
            throw 'The native printer listener outlived its Tauri application'
          } catch {
            if ($_.Exception.Message -eq 'The native printer listener outlived its Tauri application') { throw }
          }
      - name: Upload unsigned Windows test installer
        uses: actions/upload-artifact@v5
        with:
          name: restora-tauri2-win-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
