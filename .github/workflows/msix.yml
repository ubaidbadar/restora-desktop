name: MSIX (Store package)

# Builds the Microsoft Store package (unsigned) for Restora Live and
# uploads it as a workflow artifact. Microsoft signs the package after
# Store certification; the artifact here is NOT a customer installer
# and must not be distributed as one.
# Identity values are the verified Partner Center values for the
# "Badar Digital" account, checked 2026-11-12 (product "Restora Live",
# Store ID 9NHM8DPCGPZD). The "Verify Store identity" step checks
# Publisher + version exactly and rejects a stale Identity Name.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/**'
      - '.github/workflows/msix.yml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-release.json'
      - 'scripts/package-portable.cjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  MSIX_VERSION: 0.1.0.0
  PACKAGE_NAME: RestoraLive-0.1.0.0.msix

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without Electron's install-time download
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Run security and packaging checks
        run: npm run check
      - name: Cache official Electron archive
        uses: actions/cache@v4
        with:
          path: ${{runner.temp}}/restora-electron
          key: electron-${{runner.os}}-${{runner.arch}}-${{hashFiles('electron-release.json')}}
      - name: Fetch and SHA-256 verify the official Electron Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath 'electron-release.json' -Raw | ConvertFrom-Json
          $tag = $manifest.tag
          $sha256 = $manifest.sha256
          $electronVersion = $manifest.version
          $url = "https://github.com/electron/electron/releases/download/$tag/electron-v$electronVersion-win32-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'electron.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'restora-electron'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Invoke-WebRequest -Uri $url -OutFile $zip -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'restora-desktop-msix-build' }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha256.ToLowerInvariant()) { throw "Electron archive SHA-256 mismatch: expected $sha256, got $actual." }
          Write-Host "Electron $electronVersion archive verified."
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          if (-not (Test-Path -LiteralPath (Join-Path $dest 'electron.exe'))) { throw 'Electron archive is missing electron.exe.' }
      - name: Run the portable packager
        run: node scripts/package-portable.cjs
      - name: Stage the MSIX package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:GITHUB_WORKSPACE 'dist\RestoraPortable'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist\msix-stage'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'dist\RestoraPortable.zip'
          if (-not (Test-Path -LiteralPath $zipPath)) { throw "Portable zip not found: $zipPath" }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $stage
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'Restora POS.exe'))) { throw "Staged package is missing 'Restora POS.exe'." }
          # Trim Electron locale files: the portable build embeds 55
          # Chromium locale files (~44 MB). The dashboard is English;
          # keep en-US and ur (Urdu, the home market) and drop the rest
          # so the MSIX stays under the ~128 MiB file hand-off limit
          # for Partner Center upload. Chromium falls back to en-US
          # for any missing locale. Do NOT remove license files.
          $locales = Join-Path $stage 'locales'
          if (Test-Path -LiteralPath $locales) {
            Get-ChildItem -LiteralPath $locales -Filter '*.pak' |
              Where-Object { $_.Name -notin @('en-US.pak', 'ur.pak') } |
              Remove-Item -Force
            Write-Host "Kept locales: $((Get-ChildItem -LiteralPath $locales -Filter '*.pak' | Select-Object -ExpandProperty Name) -join ', ')"
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packaging\msix\AppxManifest.xml') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packaging\msix\images') -Destination $stage -Recurse
          Write-Host "Staged files:"
          Get-ChildItem -LiteralPath $stage -Recurse | ForEach-Object { Write-Host $_.FullName }
      - name: Verify Store identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'dist\msix-stage\AppxManifest.xml'
          [xml]$manifest = Get-Content -LiteralPath $manifestPath
          $identity = $manifest.Package.Identity
          if ($identity.Name -ne 'BadarDigital.RestoraLive') { throw "Unexpected Identity Name: $($identity.Name)" }
          if ($identity.Publisher -ne 'CN=BD9D01EC-4837-4E6A-A544-3A3FBC4B04CE') { throw "Unexpected Publisher: $($identity.Publisher)" }
          if ($identity.Version -ne $env:MSIX_VERSION) { throw "Unexpected Version: $($identity.Version)" }
          Write-Host "Store identity verified: $($identity.Name) $($identity.Version)"
      - name: Pack the MSIX (unsigned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makeAppx = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe'
          if (-not (Test-Path -LiteralPath $makeAppx)) {
            $makeAppx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'makeappx.exe' |
              Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makeAppx) { throw 'makeappx.exe was not found in the installed Windows SDK.' }
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist\msix-stage'
          $output = Join-Path $env:GITHUB_WORKSPACE $env:PACKAGE_NAME
          & $makeAppx pack /d $stage /p $output /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed with exit code $LASTEXITCODE." }
          $msix = Get-Item -LiteralPath $output
          Write-Host "MSIX size: $($msix.Length) bytes"
          Write-Host "MSIX SHA-256: $((Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash)"
      - name: Check the MSIX fits the Partner Center upload hand-off
        shell: pwsh
        run: |
          $size = (Get-Item "$env:GITHUB_WORKSPACE\$env:PACKAGE_NAME").Length
          Write-Host "MSIX size: $size bytes"
          if ($size -gt 130000000) { throw "MSIX is $size bytes, over the 130,000,000-byte hand-off limit." }
      - name: Upload the MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: RestoraLive-MSIX-unsigned
          path: ${{ github.workspace }}\${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          retention-days: 14
